# Netlify configuration for AmexWatch.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback — any unmatched path serves the app shell.
# Function routes (/.netlify/functions/*) are resolved before redirects,
# so this does not shadow them.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200